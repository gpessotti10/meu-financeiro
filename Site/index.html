<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Finanças</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <!-- SheetJS (xlsx) para manipulação de arquivos Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Ícone PWA e Aba do Navegador -->
    <link rel="icon" type="image/jpeg" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script>
        const e = React.createElement;

        const LISTA_CATEGORIAS = [
            'Moradia', 
            'Alimentação', 
            'Transporte', 
            'Educação', 
            'Saúde', 
            'Lazer', 
            'Investimentos', 
            'Gastos Pessoais e Entretenimento', 
            'Pets', 
            'Salário', 
            'Outros'
        ];

        function App() {
            const [senhaSalva, setSenhaSalva] = React.useState(() => localStorage.getItem('meu_financeiro_senha') || '');
            const [senhaDigitada, setSenhaDigitada] = React.useState('');
            const [autenticado, setAutenticado] = React.useState(false);

            const [mesAtual, setMesAtual] = React.useState(new Date().toISOString().slice(0, 7));
            const [abaAtiva, setAbaAtiva] = React.useState('dashboard');
            const [termoBusca, setTermoBusca] = React.useState('');
            const [filtroStatus, setFiltroStatus] = React.useState('todos');
            const [itemParaExcluir, setItemParaExcluir] = React.useState(null);
            
            const [lancamentos, setLancamentos] = React.useState(() => {
                try {
                    const salvo = localStorage.getItem('meu_financeiro_lancamentos');
                    if (salvo) return JSON.parse(salvo);
                } catch (err) {}
                return [
                    { id: 1, descricao: 'Salário', valor: 5000, tipo: 'receita', categoria: 'Salário', data: '2026-10-05', status: 'pago', recorrente: true },
                    { id: 2, descricao: 'Aluguel', valor: 1800, tipo: 'despesa', categoria: 'Moradia', data: '2026-10-10', status: 'pendente', recorrente: true },
                    { id: 3, descricao: 'Supermercado', valor: 650, tipo: 'despesa', categoria: 'Alimentação', data: '2026-10-12', status: 'pago', recorrente: false }
                ];
            });

            React.useEffect(() => {
                localStorage.setItem('meu_financeiro_lancamentos', JSON.stringify(lancamentos));
            }, [lancamentos]);

            const formatarMoeda = (val) => {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
            };

            const formatarMoedaCompacta = (val) => {
                if (val >= 1000) {
                    return `R$ ${(val / 1000).toFixed(1).replace('.', ',')}k`;
                }
                return `R$ ${Math.round(val)}`;
            };

            const formatarDataParaExcel = (dataStr) => {
                if (!dataStr) return '';
                if (dataStr.includes('-')) {
                    const partes = dataStr.split('-');
                    if (partes.length === 3) {
                        return `${partes[2]}/${partes[1]}/${partes[0]}`;
                    }
                }
                return dataStr;
            };

            const converterDataDoExcel = (dataInput) => {
                if (!dataInput) return '2026-01-01';
                if (typeof dataInput === 'number') {
                    const dataJs = new Date(Math.round((dataInput - 25569) * 86400 * 1000));
                    const ano = dataJs.getUTCFullYear();
                    const mes = String(dataJs.getUTCMonth() + 1).padStart(2, '0');
                    const dia = String(dataJs.getUTCDate()).padStart(2, '0');
                    return `${ano}-${mes}-${dia}`;
                }

                let str = String(dataInput).trim();
                if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
                if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) {
                    const partes = str.split('/');
                    return `${partes[2]}-${partes[1]}-${partes[0]}`;
                }
                return str;
            };

            const handleAutenticacao = (ev) => {
                ev.preventDefault();
                if (!senhaSalva) {
                    if (!senhaDigitada.trim()) return;
                    localStorage.setItem('meu_financeiro_senha', senhaDigitada);
                    setSenhaSalva(senhaDigitada);
                    setAutenticado(true);
                    setSenhaDigitada('');
                    alert('Senha cadastrada com sucesso!');
                } else {
                    if (senhaDigitada === senhaSalva) {
                        setAutenticado(true);
                        setSenhaDigitada('');
                    } else {
                        alert('Senha incorreta!');
                        setSenhaDigitada('');
                    }
                }
            };

            const resetarApp = () => {
                if (confirm('Deseja limpar todos os dados e redefinir o app?')) {
                    localStorage.clear();
                    window.location.reload();
                }
            };

            const lancamentosDoMes = lancamentos.filter(item => item.data && item.data.startsWith(mesAtual));
            const anoVigente = mesAtual.split('-')[0];
            const lancamentosDoAno = lancamentos.filter(item => item.data && item.data.startsWith(anoVigente));

            const totalReceitasMes = lancamentosDoMes
                .filter(i => i.tipo === 'receita')
                .reduce((acc, i) => acc + Number(i.valor), 0);

            const totalPago = lancamentosDoMes
                .filter(i => i.tipo === 'despesa' && i.status === 'pago')
                .reduce((acc, i) => acc + Number(i.valor), 0);

            const contasPendentes = lancamentosDoMes
                .filter(i => i.tipo === 'despesa' && i.status === 'pendente')
                .reduce((acc, i) => acc + Number(i.valor), 0);

            const receitasPendentes = lancamentosDoMes
                .filter(i => i.tipo === 'receita' && i.status === 'pendente')
                .reduce((acc, i) => acc + Number(i.valor), 0);

            const recebidoPagoEfetivo = lancamentosDoMes
                .filter(i => i.tipo === 'receita' && i.status === 'pago')
                .reduce((acc, i) => acc + Number(i.valor), 0) - totalPago;

            const disponivelFim = recebidoPagoEfetivo + receitasPendentes - contasPendentes;

            const lancamentosAnaliticoFiltrados = lancamentosDoMes.filter(item => {
                if (filtroStatus !== 'todos' && item.status !== filtroStatus) return false;
                if (termoBusca.trim()) {
                    const busca = termoBusca.toLowerCase();
                    const desc = (item.descricao || '').toLowerCase();
                    const cat = (item.categoria || '').toLowerCase();
                    if (!desc.includes(busca) && !cat.includes(busca)) return false;
                }
                return true;
            }).sort((a, b) => {
                const valA = a.tipo === 'receita' ? Number(a.valor) : -Number(a.valor);
                const valB = b.tipo === 'receita' ? Number(b.valor) : -Number(b.valor);
                return valA - valB;
            });

            const alternarStatus = (id) => {
                setLancamentos(lancamentos.map(item => {
                    if (item.id === id) {
                        return Object.assign({}, item, { status: item.status === 'pago' ? 'pendente' : 'pago' });
                    }
                    return item;
                }));
            };

            const iniciarExclusao = (item) => {
                if (item.recorrente) {
                    setItemParaExcluir(item);
                } else {
                    if (confirm('Deseja realmente excluir este lançamento?')) {
                        setLancamentos(lancamentos.filter(i => i.id !== item.id));
                    }
                }
            };

            const confirmarExclusao = (modoExclusao) => {
                if (!itemParaExcluir) return;

                const desc = itemParaExcluir.descricao;
                const dataReferencia = itemParaExcluir.data;

                if (modoExclusao === 'todos') {
                    setLancamentos(lancamentos.filter(item => !(item.recorrente && item.descricao === desc)));
                    alert('Toda a série recorrente foi excluída!');
                } else if (modoExclusao === 'futuros') {
                    setLancamentos(lancamentos.filter(item => !(item.recorrente && item.descricao === desc && item.data >= dataReferencia)));
                    alert('Lançamentos excluídos deste mês em diante!');
                } else {
                    setLancamentos(lancamentos.filter(item => item.id !== itemParaExcluir.id));
                    alert('Lançamento excluído com sucesso!');
                }

                setItemParaExcluir(null);
            };

            const duplicarRecorrenciaProximoAno = () => {
                const proximoAno = parseInt(anoVigente, 10) + 1;
                const recorrentesAnoAtual = lancamentos.filter(i => i.recorrente && i.data.startsWith(anoVigente));

                if (recorrentesAnoAtual.length === 0) {
                    alert('Nenhum lançamento recorrente encontrado no ano atual.');
                    return;
                }

                if (!confirm(`Duplicar recorrências de ${anoVigente} para ${proximoAno}?`)) return;

                let novosItens = [].concat(lancamentos);
                let contador = 0;

                recorrentesAnoAtual.forEach(item => {
                    const partesData = item.data.split('-');
                    const mesDia = `${partesData[1]}-${partesData[2] || '01'}`;
                    const novaDataProximoAno = `${proximoAno}-${mesDia}`;

                    const jaExiste = novosItens.some(i => i.descricao === item.descricao && i.data === novaDataProximoAno);
                    if (!jaExiste) {
                        novosItens.push(Object.assign({}, item, {
                            id: Date.now() + Math.random(),
                            data: novaDataProximoAno,
                            status: 'pendente'
                        }));
                        contador++;
                    }
                });

                setLancamentos(novosItens);
                alert(`${contador} itens duplicados para ${proximoAno}!`);
            };

            const [editandoItem, setEditandoItem] = React.useState(null);
            const [editDescricao, setEditDescricao] = React.useState('');
            const [editValor, setEditValor] = React.useState('');
            const [editTipo, setEditTipo] = React.useState('despesa');
            const [editCategoria, setEditCategoria] = React.useState('Moradia');
            const [editData, setEditData] = React.useState('');

            const iniciarEdicao = (item) => {
                setEditandoItem(item);
                setEditDescricao(item.descricao);
                setEditValor(item.valor);
                setEditTipo(item.tipo);
                setEditCategoria(item.categoria);
                setEditData(item.data);
            };

            const salvarEdicao = (ev, modoEdicao) => {
                ev.preventDefault();
                if (!editandoItem) return;

                const descricaoAntiga = editandoItem.descricao;
                const novaDesc = editDescricao;
                const novoVal = parseFloat(editValor);
                const novoTp = editTipo;
                const novoCat = editCategoria;
                const dataReferencia = editandoItem.data;

                if (editandoItem.recorrente && modoEdicao === 'todos') {
                    setLancamentos(lancamentos.map(item => {
                        if (item.recorrente && (item.descricao === descricaoAntiga || item.descricao === novaDesc)) {
                            return Object.assign({}, item, { descricao: novaDesc, valor: novoVal, tipo: novoTp, categoria: novoCat });
                        }
                        return item;
                    }));
                    alert('Toda a série de recorrências foi atualizada!');
                } else if (editandoItem.recorrente && modoEdicao === 'futuros') {
                    setLancamentos(lancamentos.map(item => {
                        if (item.recorrente && (item.descricao === descricaoAntiga || item.descricao === novaDesc) && item.data >= dataReferencia) {
                            return Object.assign({}, item, { descricao: novaDesc, valor: novoVal, tipo: novoTp, categoria: novoCat });
                        }
                        return item;
                    }));
                    alert('Lançamentos atualizados a partir deste mês em diante!');
                } else {
                    setLancamentos(lancamentos.map(item => {
                        if (item.id === editandoItem.id) {
                            return Object.assign({}, item, { descricao: editDescricao, valor: parseFloat(editValor), tipo: editTipo, categoria: editCategoria, data: editData });
                        }
                        return item;
                    }));
                    alert('Lançamento atualizado com sucesso!');
                }

                setEditandoItem(null);
            };

            const exportarExcel = () => {
                const dadosParaPlanilha = lancamentos.map(item => ({
                    ID: item.id,
                    Data: formatarDataParaExcel(item.data),
                    Tipo: item.tipo,
                    Categoria: item.categoria,
                    Descrição: item.descricao,
                    Valor: Number(item.valor),
                    Status: item.status,
                    Recorrente: item.recorrente ? 'Sim' : 'Não'
                }));

                const worksheet = XLSX.utils.json_to_sheet(dadosParaPlanilha);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Analítico Anual");
                XLSX.writeFile(workbook, `backup_financeiro_${new Date().toISOString().slice(0, 10)}.xlsx`);
            };

            const importarExcel = (ev) => {
                const arquivo = ev.target.files[0];
                if (!arquivo) return;

                const reader = new FileReader();
                reader.onload = (eCarga) => {
                    try {
                        const data = new Uint8Array(eCarga.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const primeiraAba = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[primeiraAba];
                        const jsonDados = XLSX.utils.sheet_to_json(worksheet);

                        if (jsonDados.length === 0) {
                            alert('A planilha do Excel está vazia.');
                            return;
                        }

                        let novosImportados = jsonDados.map((row, i) => ({
                            id: row.ID || (Date.now() + i),
                            data: converterDataDoExcel(row.Data || '2026-01-01'),
                            tipo: String(row.Tipo || 'despesa').toLowerCase(),
                            categoria: String(row.Categoria || 'Outros'),
                            descricao: String(row.Descrição || row.Descricao || 'Sem descrição'),
                            valor: parseFloat(row.Valor) || 0,
                            status: String(row.Status || 'pendente').toLowerCase(),
                            recorrente: String(row.Recorrente || '').toLowerCase() === 'sim' || row.Recorrente === true
                        }));

                        if (confirm(`Deseja importar/restaurar ${novosImportados.length} lançamentos do Excel?`)) {
                            setLancamentos(novosImportados);
                            alert('Dados importados com sucesso!');
                        }
                    } catch (err) {
                        alert('Erro ao processar o arquivo do Excel.');
                    }
                };
                reader.readAsArrayBuffer(arquivo);
                ev.target.value = '';
            };

            const [novaDescricao, setNovaDescricao] = React.useState('');
            const [novoValor, setNovoValor] = React.useState('');
            const [novoTipo, setNovoTipo] = React.useState('despesa');
            const [novaCategoria, setNovaCategoria] = React.useState('Moradia');
            const [novaData, setNovaData] = React.useState(mesAtual + '-01');
            const [novoRecorrente, setNovoRecorrente] = React.useState(false);

            const adicionarLancamento = (ev) => {
                ev.preventDefault();
                if (!novaDescricao || !novoValor) return;

                const novoItem = {
                    id: Date.now(),
                    descricao: novaDescricao,
                    valor: parseFloat(novoValor),
                    tipo: novoTipo,
                    categoria: novaCategoria,
                    data: novaData,
                    status: 'pendente',
                    recorrente: novoRecorrente
                };

                let novosDados = [novoItem].concat(lancamentos);

                if (novoRecorrente) {
                    let partes = novaData.split('-');
                    let ano = parseInt(partes[0], 10);
                    let mes = parseInt(partes[1], 10);
                    let dia = partes[2] || '01';

                    for (let i = 1; i <= 11; i++) {
                        mes += 1;
                        if (mes > 12) {
                            mes = 1;
                            ano += 1;
                        }
                        const mesStr = String(mes).padStart(2, '0');
                        const proximaData = `${ano}-${mesStr}-${dia}`;
                        
                        novosDados.push(Object.assign({}, novoItem, {
                            id: Date.now() + i,
                            data: proximaData
                        }));
                    }
                }

                setLancamentos(novosDados);
                setNovaDescricao('');
                setNovoValor('');
                alert('Adicionado com sucesso!');
            };

            const renderizarGraficoPizzaCircular = (listaItens, tipoFiltro) => {
                const itensFiltrados = listaItens.filter(i => String(i.tipo).toLowerCase() === tipoFiltro);
                const total = itensFiltrados.reduce((acc, i) => acc + Number(i.valor), 0);

                if (total === 0) {
                    return e('p', { className: 'text-xs text-gray-400 text-center py-4' }, `Nenhum registro de ${tipoFiltro}.`);
                }

                const porCategoria = itensFiltrados.reduce((acc, i) => {
                    const cat = i.categoria || 'Outros';
                    acc[cat] = (acc[cat] || 0) + Number(i.valor);
                    return acc;
                }, {});

                const coresHex = tipoFiltro === 'despesa' 
                    ? ['#f43f5e', '#f59e0b', '#8b5cf6', '#6366f1', '#ec4899', '#dc2626', '#f97316', '#eab308', '#14b8a6']
                    : ['#10b981', '#3b82f6', '#06b6d4', '#047857', '#2563eb'];

                let dadosArray = Object.entries(porCategoria).map(([cat, val]) => ({
                    cat,
                    val,
                    percentual: (val / total) * 100
                })).sort((a, b) => b.percentual - a.percentual);

                let acumulado = 0;
                const fatiasGradient = [];
                const dadosLegenda = dadosArray.map((item, idx) => {
                    const cor = coresHex[idx % coresHex.length];
                    const inicio = acumulado;
                    acumulado += item.percentual;
                    fatiasGradient.push(`${cor} ${inicio}% ${acumulado}%`);
                    return Object.assign({}, item, { cor });
                });

                const estiloConic = {
                    background: `conic-gradient(${fatiasGradient.join(', ')})`
                };

                return e('div', { className: 'flex flex-col items-center space-y-4 py-2' },
                    e('div', { 
                        style: estiloConic, 
                        className: 'w-48 h-48 rounded-full shadow-md border-2 border-white relative flex items-center justify-center' 
                    },
                        e('div', { className: 'w-28 h-28 bg-white rounded-full shadow-inner flex flex-col items-center justify-center p-1 text-center' },
                            e('span', { className: 'text-[10px] text-gray-400 font-semibold uppercase' }, 'Total'),
                            e('span', { className: `text-xs font-bold ${tipoFiltro === 'despesa' ? 'text-rose-600' : 'text-emerald-600'}` }, formatarMoeda(total))
                        )
                    ),
                    e('div', { className: 'w-full space-y-1.5 pt-1 text-xs' },
                        dadosLegenda.map(item => 
                            e('div', { key: item.cat, className: 'flex items-center justify-between bg-gray-50 p-2 rounded-lg border border-gray-100' },
                                e('div', { className: 'flex items-center gap-2 truncate' },
                                    e('span', { style: { backgroundColor: item.cor }, className: 'w-3 h-3 rounded-full shrink-0' }),
                                    e('span', { className: 'text-gray-700 font-medium truncate' }, item.cat)
                                ),
                                e('div', { className: 'text-right shrink-0 ml-2' },
                                    e('span', { className: 'font-bold text-gray-900 mr-2' }, formatarMoeda(item.val)),
                                    e('span', { className: 'text-[11px] text-gray-500 bg-gray-200 px-1.5 py-0.5 rounded' }, `${item.percentual.toFixed(1)}%`)
                                )
                            )
                        )
                    )
                );
            };

            if (!autenticado) {
                return e('div', { className: 'max-w-md mx-auto bg-white min-h-screen p-6 flex flex-col justify-center items-center shadow-lg' },
                    e('div', { className: 'w-full max-w-sm bg-gray-50 p-6 rounded-2xl border border-gray-200 shadow-sm space-y-4 text-center' },
                        
                        // Logo adicionado aqui no lugar do ícone de cadeado
                        e('div', { className: 'w-28 h-28 mx-auto rounded-[2rem] overflow-hidden shadow-inner bg-white flex items-center justify-center' },
                            e('img', { 
                                src: 'logo.png', 
                                alt: 'Logo Minhas Finanças', 
                                className: 'w-full h-full object-cover p-1',
                                onError: (ev) => { 
                                    ev.target.style.display = 'none'; 
                                    ev.target.parentNode.innerHTML = '<span class="text-4xl">🔐</span>'; 
                                }
                            })
                        ),

                        e('h2', { className: 'text-xl font-bold text-blue-600' }, 'Minhas Finanças'),
                        e('p', { className: 'text-xs text-gray-500' }, !senhaSalva ? 'Defina uma senha de acesso:' : 'Digite sua senha para desbloquear:'),
                        e('form', { onSubmit: handleAutenticacao, className: 'space-y-3' },
                            e('input', {
                                type: 'password',
                                placeholder: '••••••••',
                                value: senhaDigitada,
                                onChange: (ev) => setSenhaDigitada(ev.target.value),
                                className: 'w-full p-3 border rounded-xl text-center text-lg tracking-widest bg-white outline-none focus:border-blue-500',
                                required: true,
                                autoFocus: true
                            }),
                            e('button', { type: 'submit', className: 'w-full bg-blue-600 text-white py-3 rounded-xl font-semibold text-sm hover:bg-blue-700 shadow transition flex items-center justify-center gap-2' },
                                '✨ ', !senhaSalva ? 'Criar Senha e Entrar' : 'Desbloquear'
                            )
                        ),
                        senhaSalva && e('button', { onClick: resetarApp, className: 'text-[11px] text-rose-500 hover:underline pt-2 block mx-auto' }, 'Esqueci a senha / Resetar App')
                    )
                );
            }

            return e('div', { className: 'max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-between pb-20 relative' },
                e('header', { className: 'bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md' },
                    e('div', { className: 'flex justify-between items-center mb-1' },
                        e('div', { className: 'flex items-center gap-2' },
                            e('span', { className: 'text-lg' }, '📊'),
                            e('h1', { className: 'text-lg font-bold' }, 'Minhas Finanças')
                        ),
                        e('div', { className: 'flex items-center gap-2' },
                            e('input', {
                                type: 'month',
                                value: mesAtual,
                                onChange: (ev) => setMesAtual(ev.target.value),
                                className: 'bg-blue-700 text-white px-2 py-1 rounded text-sm border border-blue-500 outline-none'
                            }),
                            e('button', { onClick: () => setAutenticado(false), className: 'text-xs bg-blue-700 hover:bg-blue-800 p-1.5 rounded transition', title: 'Bloquear App' }, '🔒')
                        )
                    )
                ),
                e('main', { className: 'p-4 flex-1 space-y-4' },
                    abaAtiva === 'dashboard' && e('div', { className: 'space-y-4' },
                        e('div', { className: 'grid grid-cols-1 gap-3' },
                            e('div', { className: 'bg-blue-50 border border-blue-200 p-4 rounded-xl shadow-sm flex items-center justify-between' },
                                e('div', null,
                                    e('p', { className: 'text-xs text-blue-600 font-semibold uppercase flex items-center gap-1.5' }, '📥 Receitas (Mês)'),
                                    e('p', { className: 'text-2xl font-bold text-blue-700 mt-0.5' }, formatarMoeda(totalReceitasMes))
                                ),
                                e('span', { className: 'text-2xl opacity-80' }, '💰')
                            ),
